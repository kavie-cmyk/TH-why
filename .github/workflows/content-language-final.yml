name: One-shot final content and proposal voice correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-language-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct source alignment and proposal voice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, unicodedata

          p = Path('index.html')
          raw = p.read_text(encoding='utf-8-sig')

          def enc(s):
              s = unicodedata.normalize('NFC', s)
              return ''.join(ch if ord(ch) < 128 else f'&#x{ord(ch):X};' for ch in s)

          def repl(old, new, label, min_count=1):
              global raw
              old_e, new_e = enc(old), enc(new)
              n = raw.count(old_e)
              if n < min_count:
                  raise SystemExit(f'{label}: expected >= {min_count} match, found {n}')
              raw = raw.replace(old_e, new_e)
              print(label, n)

          # CONTENT FIX 1 — 5692 uses 100% of tourism-resource data, not 100% of recognized destinations.
          repl(
              'Khu/điểm được công nhận được số hóa',
              'Dữ liệu tài nguyên du lịch được số hóa đến năm 2030',
              'target 100pct resource data'
          )

          # CONTENT FIX 2 — 1,200–1,500 is an ecosystem participation/integration scale, not an HM3-only database KPI.
          repl(
              'Cơ sở kinh doanh dịch vụ du lịch trong cơ sở dữ liệu',
              'Doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số',
              'target 1200-1500 ecosystem participation'
          )

          old_scope = ('Cơ sở dữ liệu chuyên ngành du lịch và bản đồ số ngành du lịch hướng tới số hóa 100% khu, điểm du lịch được công nhận và 1.200–1.500 cơ sở kinh doanh dịch vụ du lịch; '
                       'tối thiểu 20 sản phẩm trải nghiệm số di sản, sinh thái, văn hóa được phát triển và liên kết với hệ sinh thái.')
          new_scope = ('Cơ sở dữ liệu chuyên ngành du lịch và bản đồ số ngành du lịch hướng tới chuẩn hóa, tích hợp và chia sẻ dữ liệu chuyên ngành ở quy mô toàn tỉnh; đến năm 2030, mục tiêu số hóa đạt 100% dữ liệu tài nguyên du lịch theo phạm vi Đề án. '
                       'Khoảng 1.200–1.500 doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số; tối thiểu 20 sản phẩm trải nghiệm số di sản, sinh thái, văn hóa được phát triển và liên kết với hệ sinh thái.')
          repl(old_scope, new_scope, 'detailed targets source alignment')

          # Exact pillar terminology in the explanatory detail.
          repl('quản lý – điều hành thông minh', 'quản lý, điều hành thông minh', 'pillar terminology')

          # Replace audit-like clarification with proposal-author explanation.
          repl(
              'Chỉ tiêu kết nối tối thiểu 10 khu, điểm của Phân hệ Trung tâm điều hành du lịch thông minh tích hợp IOC tỉnh và hệ thống trí tuệ nhân tạo là chỉ tiêu kết nối dữ liệu và giám sát với IOC, không đồng nhất với số khu, điểm được đầu tư mới toàn bộ hạ tầng tại chỗ trong Hạ tầng số và kết nối tại các khu, điểm du lịch.',
              'Chỉ tiêu kết nối tối thiểu 10 khu, điểm của Phân hệ Trung tâm điều hành du lịch thông minh tích hợp IOC tỉnh và hệ thống trí tuệ nhân tạo phản ánh phạm vi kết nối dữ liệu và giám sát với IOC; phạm vi đầu tư hạ tầng tại chỗ của Hạ tầng số và kết nối tại các khu, điểm du lịch được xác định riêng theo danh mục triển khai.',
              '10-point scope clarification'
          )

          # Public-investment boundary: keep the substance, state it as the proposal's implementation approach rather than a reviewer instruction.
          repl(
              'Đối với các cấu phần có khả năng tạo doanh thu hoặc khai thác thương mại, đầu tư công tập trung vào tài sản, chuẩn kết nối và năng lực dùng chung phục vụ mục tiêu phát triển ngành; phương án đầu tư, khai thác và phân bổ rủi ro của từng cấu phần cần được xác định ở bước chuẩn bị đầu tư và nghiên cứu khả thi, bảo đảm không thay thế những dịch vụ thị trường có thể cung cấp hiệu quả.',
              'Đối với các cấu phần có khả năng tạo doanh thu hoặc khai thác thương mại, đầu tư công tập trung vào tài sản, chuẩn kết nối và năng lực dùng chung phục vụ mục tiêu phát triển ngành. Trong bước chuẩn bị đầu tư và nghiên cứu khả thi, phương án khai thác và phân bổ rủi ro được cụ thể hóa theo nguyên tắc khu vực công tạo năng lực dùng chung, còn các dịch vụ thị trường tiếp tục do doanh nghiệp cung cấp.',
              'public-market proposal voice'
          )

          # Development note: persuasive proposal voice, not directive/reviewer voice.
          repl(
              'mục tiêu tăng tổng thu không thể chỉ dựa vào tăng lượng khách; giá trị chuyến đi, không gian hưởng lợi, chất lượng trải nghiệm và năng lực quản lý dựa trên dữ liệu cần được nâng lên đồng bộ.',
              'khoảng cách giữa mục tiêu tăng lượt khách và mục tiêu tăng tổng thu đặt ra yêu cầu đồng thời nâng giá trị chuyến đi, mở rộng không gian hưởng lợi, cải thiện chất lượng trải nghiệm và tăng năng lực quản lý dựa trên dữ liệu.',
              '2030 proposal framing'
          )

          # Economic scenario: preserve boundaries but write from the proposal team's position.
          repl(
              'Các chỉ tiêu định lượng được xây dựng theo kịch bản lợi ích dự kiến, với giả định các hạng mục được triển khai đồng bộ và đạt mức sử dụng phù hợp. Kịch bản B/C, thời gian hoàn vốn và giá trị hiện tại thuần (NPV) sẽ tiếp tục được hoàn thiện cùng phương án đầu tư khi tổng mức đầu tư, tiến độ giải ngân, chi phí vận hành và dòng lợi ích được xác định đầy đủ. Doanh thu du lịch tăng thêm 1.800–3.000 tỷ đồng/năm phản ánh phần tổng thu du lịch có thể tăng theo kịch bản phát triển ngành; phần lợi ích kinh tế định lượng 500–800 tỷ đồng/năm là nhóm giá trị được sử dụng riêng cho tính toán hiệu quả tổng hợp. Hai nhóm giá trị được tách riêng trong tính toán để tránh trùng lặp.',
              'Các chỉ tiêu định lượng được xây dựng theo kịch bản lợi ích dự kiến, trên giả định các hạng mục được triển khai đồng bộ và đạt mức sử dụng phù hợp. Doanh thu du lịch tăng thêm 1.800–3.000 tỷ đồng/năm phản ánh phần tổng thu du lịch có thể tăng theo kịch bản phát triển ngành; lớp lợi ích kinh tế định lượng 500–800 tỷ đồng/năm được sử dụng riêng trong tính toán hiệu quả tổng hợp để tránh trùng lặp giá trị. Khi phương án đầu tư được hoàn thiện, B/C, thời gian hoàn vốn và giá trị hiện tại thuần (NPV) được cập nhật theo tổng mức đầu tư, tiến độ giải ngân, chi phí vận hành và dòng lợi ích của phương án.',
              'economic scenario proposal voice'
          )

          # Risk narrative: describe the consequence instead of instructing the Province.
          repl(
              'Dữ liệu có nhưng không được chuyển thành quy trình điều hành thì tỉnh vẫn phải xử lý theo mô hình hậu kiểm và phối hợp thủ công;',
              'Dữ liệu có nhưng không được chuyển thành quy trình điều hành thì hoạt động quản lý vẫn phụ thuộc nhiều vào hậu kiểm và phối hợp thủ công;',
              'risk narrative proposal voice'
          )

          # Harmonize the summary line for 1,200–1,500 where it appears as a visible target value.
          # The numeric value itself is kept unchanged and sourced to 5692.

          dec = html.unescape(raw)

          required = [
              '100% dữ liệu tài nguyên du lịch',
              '1.200–1.500 doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số',
              'Quản lý, điều hành thông minh', 'Điểm đến thông minh', 'Doanh nghiệp thông minh', 'Du khách thông minh',
              'Kho dữ liệu du lịch dùng chung', 'Ứng dụng Thanh Hóa Smart Tourism',
              'Hạ tầng số và kết nối tại các khu, điểm du lịch',
              'Phân hệ Trung tâm điều hành du lịch thông minh tích hợp IOC tỉnh và hệ thống trí tuệ nhân tạo',
              'Cơ sở dữ liệu chuyên ngành du lịch và bản đồ số ngành du lịch',
              'Số hóa và trải nghiệm số di sản, sinh thái, văn hóa',
              'Quản lý doanh nghiệp, hộ kinh doanh và giám sát dịch vụ',
              'Ứng dụng Thanh Hóa Smart Tourism và kênh phản ánh của du khách',
              'Công viên du lịch số Thanh Hóa và phát triển nhân lực số',
              'Bảy hạng mục có quan hệ bổ trợ hai chiều, không phụ thuộc vào một trình tự vận hành cứng.',
              '1.800–3.000 tỷ đồng/năm', '500–800 tỷ đồng/năm',
          ]
          for x in required:
              if x not in dec:
                  raise SystemExit(f'QA missing required content: {x}')

          forbidden = [
              'số hóa 100% khu, điểm du lịch được công nhận',
              'Cơ sở kinh doanh dịch vụ du lịch trong cơ sở dữ liệu',
              'quản lý – điều hành thông minh',
              'Thanh Hóa phải', 'tỉnh cần', 'tỉnh phải',
              'phải được xác định lại', 'thuộc bước thẩm định', 'chưa được thẩm định độc lập',
              'không được cộng trực tiếp', 'không được suy rộng', 'Điểm cần kiểm soát',
              'chuỗi giá trị thống nhất', 'bước tiếp theo', 'mắt xích',
              'Bảng trên cho thấy', 'tài liệu này', 'hồ sơ Đề án', 'cách đọc'
          ]
          bad = [x for x in forbidden if x in dec]
          if bad:
              raise SystemExit('LANGUAGE_QA residual forbidden phrases: ' + repr(bad))

          p.write_text(raw, encoding='utf-8')
          print('CONTENT_AND_PROPOSAL_VOICE_QA_PASS')
          PY

      - name: Commit corrected HTML and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Proposal QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/content-language-final.yml
          git add index.html .github/workflows/content-language-final.yml
          git commit -m "Correct TH-why content and proposal-author voice"
          git push