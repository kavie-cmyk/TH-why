name: One-shot proposal language QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-qa.yml'

permissions:
  contents: write

jobs:
  language-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align language with approved submission version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, html, unicodedata

          p = Path('index.html')
          raw = p.read_text(encoding='utf-8-sig')

          def enc(s):
              s = unicodedata.normalize('NFC', s)
              return ''.join(ch if ord(ch) < 128 else f'&#x{ord(ch):X};' for ch in s)

          def rep(old, new, label, required=False):
              global raw
              o, n = enc(old), enc(new)
              c = raw.count(o)
              if c > 1:
                  raise SystemExit(f'{label}: ambiguous, found {c}')
              if required and c != 1:
                  raise SystemExit(f'{label}: expected 1, found {c}')
              if c == 1:
                  raw = raw.replace(o, n)

          # Section I: use the approved proposal voice rather than directive/consulting voice.
          s1_start = enc('Khoảng cách giữa tốc độ tăng lượt khách và tốc độ tăng tổng thu cho thấy yêu cầu phát triển giai đoạn 2026–2030 không thể chỉ dựa vào việc thu hút thêm khách.')
          s1_end = enc('sáu nhóm vấn đề thực tiễn này cần được xử lý đồng thời và có tính liên thông.</p>')
          s1_pat = re.compile(r'<p>' + re.escape(s1_start) + r'.*?' + re.escape(s1_end), re.S)
          if len(list(s1_pat.finditer(raw))) != 1:
              raise SystemExit('section I concluding paragraph not uniquely found')
          s1 = ('Khoảng cách giữa tốc độ tăng lượt khách và tốc độ tăng tổng thu cho thấy yêu cầu phát triển giai đoạn 2026–2030 không thể chỉ dựa vào việc thu hút thêm khách. '
                'Để đạt mục tiêu, yêu cầu đặt ra là đồng thời kéo dài hành trình, mở rộng mức sử dụng dịch vụ, phân bổ dòng khách sang nhiều không gian du lịch hơn, nâng chất lượng trải nghiệm và tăng năng lực quản lý dựa trên dữ liệu. '
                'Đây cũng là thời điểm IOC tỉnh đã đi vào vận hành và dữ liệu văn hóa, du lịch đang được rà soát, chuẩn hóa, kết nối theo Chỉ thị số 10/CT-UBND năm 2026, tạo điều kiện chuyển từ các hệ thống riêng lẻ sang khai thác dữ liệu và dịch vụ dùng chung (UBND tỉnh Thanh Hóa, 2026). '
                'Trong điều kiện đó, các trở ngại đang làm giảm khả năng tạo giá trị của toàn hệ thống du lịch cần được xử lý theo một logic liên thông. Sáu nhóm vấn đề thực tiễn có quan hệ trực tiếp với yêu cầu tăng trưởng đến năm 2030 và cần được xử lý đồng bộ.')
          raw = s1_pat.sub('<p>' + enc(s1) + '</p>', raw, count=1)

          rep(
              '<div class="note gold"><strong>Hàm ý đối với đầu tư:</strong> để đạt mục tiêu 2030, tỉnh không thể chỉ dựa vào tăng lượng khách. Cần đồng thời nâng giá trị chuyến đi, mở rộng không gian hưởng lợi, cải thiện trải nghiệm và tăng năng lực quản lý dựa trên dữ liệu.</div>',
              '<div class="note gold"><strong>Yêu cầu phát triển đến năm 2030:</strong> mục tiêu tăng tổng thu không thể chỉ dựa vào tăng lượng khách; giá trị chuyến đi, không gian hưởng lợi, chất lượng trải nghiệm và năng lực quản lý dựa trên dữ liệu cần được nâng lên đồng bộ.</div>',
              'section I callout')

          # Section II lead and synthesis: final approved wording.
          old_lead = ('Để đạt yêu cầu tăng trưởng đến năm 2030, Thanh Hóa cần xử lý sáu nhóm vấn đề đang hạn chế khả năng khai thác đầy đủ quy mô thị trường, tài nguyên và nguồn cung du lịch. '
                      'Các vấn đề này có quan hệ chặt chẽ với nhau: thời gian lưu trú, mức chi tiêu, phân bố dòng khách, độ đa dạng của sản phẩm, khả năng kết nối doanh nghiệp – dịch vụ, chất lượng trải nghiệm và năng lực điều hành dựa trên dữ liệu cùng tác động tới giá trị tạo ra từ mỗi chuyến đi.')
          new_lead = ('Để đáp ứng yêu cầu tăng trưởng đến năm 2030, sáu nhóm vấn đề đang hạn chế khả năng khai thác đầy đủ quy mô thị trường, tài nguyên và nguồn cung du lịch cần được xử lý đồng bộ. '
                      'Các vấn đề này không tồn tại tách biệt. Yêu cầu kéo dài hành trình và tăng mức sử dụng dịch vụ để nâng tổng thu có quan hệ với sự tập trung dòng khách, mức độ đa dạng của sản phẩm, khả năng kết nối doanh nghiệp – dịch vụ, chất lượng trải nghiệm và năng lực điều hành dựa trên dữ liệu. '
                      'Vì có quan hệ qua lại, xử lý từng vấn đề riêng lẻ khó tạo ra thay đổi đủ lớn; hiệu quả chỉ được nâng lên khi các năng lực liên quan được kết nối.')
          rep(old_lead, new_lead, 'section II lead', required=True)

          rep(
              '<div class="note">Sáu vấn đề có quan hệ với nhau. Nếu tiếp tục xử lý bằng các ứng dụng, thiết bị hoặc cơ sở dữ liệu riêng lẻ, sự phân mảnh khó được khắc phục; cần hình thành một hệ sinh thái trong đó hạ tầng, dữ liệu, điều hành, doanh nghiệp, nội dung số và hành trình du khách hỗ trợ lẫn nhau.</div>',
              '<div class="note">Sáu nhóm vấn đề không tồn tại độc lập. Khả năng nâng giá trị chuyến đi phụ thuộc trực tiếp vào việc du khách tìm thấy và kết nối được nhiều sản phẩm, trải nghiệm và dịch vụ hơn; sự tập trung mùa vụ và không gian liên quan đến năng lực giới thiệu, điều hướng và tổ chức sản phẩm ngoài các điểm đông khách; chất lượng dịch vụ phụ thuộc vào dữ liệu nhà cung cấp, phản ánh của du khách và khả năng giám sát. Nếu từng vấn đề tiếp tục được xử lý bằng các ứng dụng, thiết bị hoặc cơ sở dữ liệu tách rời, sự phân mảnh hiện nay sẽ khó được khắc phục. Yêu cầu đầu tư cốt lõi là hình thành một hệ sinh thái trong đó hạ tầng, dữ liệu, điều hành, doanh nghiệp, nội dung số và hành trình của du khách được thiết kế để hỗ trợ lẫn nhau.</div>',
              'section II synthesis')

          # Section III wording from the approved submission version.
          rep(
              'Vì vậy, cấu trúc đầu tư được tổ chức theo các hạng mục có phạm vi và chức năng khác nhau nhưng bổ trợ lẫn nhau, cùng sử dụng dữ liệu và dịch vụ dùng chung ở quy mô toàn tỉnh.',
              'Vì vậy, cấu trúc đầu tư cần vừa đáp ứng nhu cầu riêng của từng nhóm chủ thể, vừa hình thành một hệ thống năng lực liên thông, tránh phát triển các hạng mục như những hệ thống độc lập.',
              'section III architecture sentence', required=True)

          rep(
              'Hệ sinh thái được hình thành trên bốn trụ cột: quản lý, điều hành thông minh, điểm đến thông minh, doanh nghiệp thông minh và du khách thông minh; bảy hạng mục đầu tư cung cấp các năng lực cụ thể để hình thành và vận hành bốn trụ cột này.',
              'Hệ sinh thái được hình thành trên bốn trụ cột: Quản lý, điều hành thông minh; Điểm đến thông minh; Doanh nghiệp thông minh; Du khách thông minh. Bảy hạng mục đầu tư cung cấp các năng lực cụ thể để hình thành và vận hành bốn trụ cột này.',
              'pillar sentence')

          # Remove reviewer voice in item-level paragraphs without changing scope or evidence.
          rep(
              'Hiệu quả của hạng mục cần được đánh giá theo mức độ sử dụng thực tế, độ ổn định và khả năng đưa dữ liệu vào hoạt động điều hành, bên cạnh số lượng thiết bị được lắp đặt.',
              'Giá trị đầu tư của hạng mục phụ thuộc vào mức độ sử dụng thực tế, độ ổn định và khả năng đưa dữ liệu vào hoạt động điều hành, không chỉ vào số lượng thiết bị được lắp đặt.',
              'HM1 reviewer voice')
          rep(
              'Hiệu quả cần được đánh giá bằng khả năng hoàn thành nhu cầu thực tế, mức sử dụng lặp lại, giao dịch được thực hiện và chất lượng xử lý phản ánh, không chỉ bằng số lượt tải hoặc số lượng tính năng.',
              'Hiệu quả của hạng mục thể hiện ở khả năng đáp ứng nhu cầu thực tế, mức sử dụng lặp lại, giao dịch được thực hiện và chất lượng xử lý phản ánh, không chỉ ở số lượt tải hoặc số lượng tính năng.',
              'HM6 reviewer voice')
          rep(
              'hiệu quả thương mại của từng dịch vụ, quy mô đầu tư và mô hình vận hành phải được đánh giá riêng ở bước nghiên cứu khả thi.',
              'hiệu quả thương mại của từng dịch vụ, quy mô đầu tư và mô hình vận hành sẽ được xác định ở bước nghiên cứu khả thi trên cơ sở điều kiện cụ thể của dự án.',
              'HM7 feasibility voice')
          rep(
              'Kết quả tại các mô hình này cho thấy nhu cầu thực đối với trải nghiệm số, nhưng không phản ánh trực tiếp quy mô đầu tư, mô hình sở hữu hoặc hiệu quả tài chính của Công viên du lịch số Thanh Hóa.',
              'Các số liệu này cung cấp căn cứ về khả năng hình thành nhu cầu đối với trải nghiệm số; quy mô đầu tư, mô hình sở hữu và hiệu quả tài chính của Công viên du lịch số Thanh Hóa vẫn phụ thuộc vào điều kiện triển khai cụ thể.',
              'HM7 benchmark boundary')
          rep(
              'Vì vậy, việc đầu tư Công viên cần gắn đồng thời với sức hấp dẫn của sản phẩm, khả năng làm mới nội dung và yêu cầu vận hành dài hạn; các thông số chi tiết về quy mô, vị trí, cấu hình đầu tư và cơ chế vận hành thuộc các bước chuẩn bị đầu tư và nghiên cứu khả thi tương ứng.',
              'Do đó, phương án đầu tư Công viên cần gắn sức hấp dẫn của sản phẩm với khả năng làm mới nội dung và yêu cầu vận hành dài hạn; các thông số chi tiết về quy mô, vị trí, cấu hình đầu tư và cơ chế vận hành được xác định trong các bước chuẩn bị đầu tư và nghiên cứu khả thi tương ứng.',
              'HM7 investment wording')

          # Section V note: proposal condition, not audit instruction.
          rep('<strong>Điểm cần kiểm soát:</strong>', '<strong>Điều kiện tạo hiệu quả:</strong>', 'section V note label')

          # Benchmarks: retain claim boundary in proposal voice, remove reviewer/academic phrasing.
          rep(
              'Các kết quả này được dùng để kiểm chứng cơ chế tạo giá trị; không được chuyển trực tiếp thành tỷ lệ dự báo cho Thanh Hóa.',
              'Các kết quả này được sử dụng làm căn cứ về cơ chế tạo giá trị; không đồng nghĩa với tỷ lệ dự báo trực tiếp cho Thanh Hóa.',
              'benchmark chart subtitle')
          rep('Nghiên cứu DID ghi nhận tác động dương có ý nghĩa thống kê tới số đêm lưu trú và lượng tìm kiếm; hiệu ứng không đồng đều giữa các giai đoạn.',
              'Nghiên cứu định lượng ghi nhận tác động dương có ý nghĩa thống kê tới số đêm lưu trú và lượng tìm kiếm; mức tác động khác nhau giữa các giai đoạn.',
              'benchmark card jargon')
          rep(
              'Nghiên cứu chênh lệch-trong-chênh lệch về chính sách Thành phố Du lịch Thông minh tại Hàn Quốc ghi nhận tác động dương có ý nghĩa thống kê tới số đêm lưu trú và lượng tìm kiếm trực tuyến tại các địa phương được can thiệp (Um, Koo and Chung, 2026).',
              'Một nghiên cứu định lượng về chính sách Thành phố Du lịch Thông minh tại Hàn Quốc ghi nhận tác động dương có ý nghĩa thống kê tới số đêm lưu trú và lượng tìm kiếm trực tuyến tại các địa phương được triển khai (Um, Koo and Chung, 2026).',
              'benchmark body jargon')

          # Scenario labels/callout: preserve scenario status while removing reviewer voice.
          raw = raw.replace(enc('Phải xác định lại khi thẩm định'), enc('Xác định chính thức ở bước thẩm định kinh tế – tài chính'))
          rep(
              '<div class="note gold"><strong>Phạm vi của kịch bản lợi ích:</strong> các con số lợi ích là kịch bản dự kiến, không phải kết quả đã được thẩm định độc lập. B/C, hoàn vốn và NPV phải được xác định lại ở bước thẩm định kinh tế – tài chính khi có đầy đủ chi phí, tiến độ, chi phí vận hành và dòng lợi ích.</div>',
              '<div class="note gold"><strong>Phạm vi của kịch bản lợi ích:</strong> các giá trị định lượng được xây dựng dưới dạng kịch bản dự kiến. Việc xác định chính thức B/C, thời gian hoàn vốn và NPV được thực hiện trên cơ sở đầy đủ tổng mức đầu tư, tiến độ giải ngân, chi phí vận hành và dòng lợi ích.</div>',
              'scenario callout')

          # Section VII: neutral evidence wording.
          rep('là một cảnh báo trực tiếp rằng triển khai công nghệ không tự tạo ra mức sử dụng',
              'là một ví dụ cho thấy triển khai công nghệ không tự tạo ra mức sử dụng',
              'section VII benchmark wording')

          # Replace the conclusion with the approved final conclusion.
          c_start = enc('Mục tiêu phát triển du lịch đến năm 2030 đòi hỏi Thanh Hóa không chỉ tăng lượng khách')
          c_end = enc('trong giai đoạn 2026–2030.</p>')
          c_pat = re.compile(r'<div class="conclusion">\s*<p>' + re.escape(c_start) + r'.*?' + re.escape(c_end) + r'\s*</div>', re.S)
          if len(list(c_pat.finditer(raw))) != 1:
              raise SystemExit('conclusion block not uniquely found')
          conclusion = ('<div class="conclusion">'
              '<p>' + enc('Thanh Hóa đã có quy mô thị trường du lịch lớn, nguồn tài nguyên đa dạng, mạng lưới doanh nghiệp rộng và nền tảng chuyển đổi số ban đầu. Yêu cầu của giai đoạn 2026–2030 là chuyển những nguồn lực này thành mức tăng cao hơn về giá trị chuyến đi, chất lượng trải nghiệm, hiệu quả quản trị và khả năng phân bổ lợi ích giữa các địa bàn. Những hạn chế hiện tại có quan hệ chặt chẽ với nhau và không thể được xử lý hiệu quả bằng các giải pháp riêng lẻ. Vì vậy, cần hình thành một hệ thống năng lực liên thông từ hạ tầng, dữ liệu và điều hành tới doanh nghiệp, sản phẩm số và hành trình của du khách.') + '</p>'
              '<p>' + enc('Lợi ích kỳ vọng của khoản đầu tư nằm ở khả năng hình thành một cơ chế vận hành thống nhất cho du lịch tỉnh: dữ liệu được dùng chung; điểm đến và doanh nghiệp được kết nối; du khách có hành trình thuận tiện hơn; cơ quan quản lý có thông tin để dự báo, giám sát và xử lý; nội dung số được tái sử dụng để hình thành sản phẩm và nguồn thu mới. Thực tiễn triển khai tại các mô hình tương đồng cho thấy những cơ chế này có thể tạo ra kết quả thực tế về lưu trú, phân bổ dòng khách, giao dịch, mức tham gia của doanh nghiệp và sức hút của sản phẩm số khi được tổ chức và vận hành phù hợp.') + '</p>'
              '<p>' + enc('Trong bối cảnh mục tiêu phát triển du lịch của tỉnh đến năm 2030 yêu cầu tổng thu tăng nhanh hơn đáng kể so với lượng khách, việc tiếp tục phát triển theo mô hình phân tán sẽ làm tăng chi phí phối hợp và làm chậm khả năng chuyển tài nguyên hiện có thành giá trị kinh tế. Vì vậy, đầu tư thực hiện Đề án “Xây dựng, phát triển hệ sinh thái du lịch thông minh tỉnh Thanh Hóa, giai đoạn 2026–2030” là cần thiết để hình thành năng lực dùng chung ở cấp tỉnh, khai thác hiệu quả hơn các tài sản đã đầu tư, mở rộng giá trị từ mỗi chuyến đi và nâng chất lượng quản trị du lịch trong toàn giai đoạn 2026–2030.') + '</p>'
              '</div>')
          raw = c_pat.sub(conclusion, raw, count=1)
          raw = raw.replace('<div class="section-head"><div class="section-num">VIII</div><h2>K&#x1EBF;t lu&#x1EAD;n</h2></div>', '<div class="section-head"><div class="section-num">VIII</div><h2>' + enc('Kết luận về sự cần thiết thực hiện Đề án') + '</h2></div>')

          # Final language gate: no reviewer/meta/pipeline/directive residues targeted by the brief.
          dec = html.unescape(raw)
          forbidden = [
              'Muốn đạt mục tiêu, Thanh Hóa phải', 'Thanh Hóa cần xử lý sáu nhóm vấn đề',
              'Hiệu quả của hạng mục cần được đánh giá', 'Hiệu quả cần được đánh giá bằng',
              'phải được đánh giá riêng ở bước nghiên cứu khả thi', 'Điểm cần kiểm soát:',
              'Phải xác định lại khi thẩm định', 'không phải kết quả đã được thẩm định độc lập',
              'phải được xác định lại ở bước thẩm định', 'không được chuyển trực tiếp thành tỷ lệ dự báo',
              'không được suy rộng', 'cảnh báo trực tiếp rằng', 'Nghiên cứu chênh lệch-trong-chênh lệch',
              'bước tiếp theo', 'mắt xích', 'chuỗi giá trị thống nhất', 'Bảng trên cho thấy', 'Các chỉ tiêu trong Bảng 3'
          ]
          hits = [x for x in forbidden if x in dec]
          if hits:
              raise SystemExit('LANGUAGE_QA_FAIL: ' + ' | '.join(hits))
          for x in ['Quản lý, điều hành thông minh','Điểm đến thông minh','Doanh nghiệp thông minh','Du khách thông minh',
                    'Hạ tầng số và kết nối tại các khu, điểm du lịch','Phân hệ Trung tâm điều hành du lịch thông minh tích hợp IOC tỉnh và hệ thống trí tuệ nhân tạo',
                    'Cơ sở dữ liệu chuyên ngành du lịch và bản đồ số ngành du lịch','Số hóa và trải nghiệm số di sản, sinh thái, văn hóa',
                    'Quản lý doanh nghiệp, hộ kinh doanh và giám sát dịch vụ','Ứng dụng Thanh Hóa Smart Tourism và kênh phản ánh của du khách',
                    'Công viên du lịch số Thanh Hóa và phát triển nhân lực số']:
              if x not in dec:
                  raise SystemExit('LANGUAGE_QA_FAIL missing locked term: ' + x)

          p.write_text(raw, encoding='utf-8')
          print('LANGUAGE_QA_PASS')
          PY

