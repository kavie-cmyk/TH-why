name: One-shot proposal-author language polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proposal-voice-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish proposal-author voice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import html, unicodedata, re

          p = Path('index.html')
          raw = p.read_text(encoding='utf-8-sig')

          def enc(s):
              s = unicodedata.normalize('NFC', s)
              return ''.join(ch if ord(ch) < 128 else f'&#x{ord(ch):X};' for ch in s)

          def replace_once(old, new, label):
              global raw
              oe, ne = enc(old), enc(new)
              n = raw.count(oe) + raw.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              raw = raw.replace(oe, ne).replace(old, new)
              print(label, n)

          def flex_pattern(s):
              out=[]
              for ch in unicodedata.normalize('NFC', s):
                  if ord(ch)<128:
                      out.append(re.escape(ch))
                  else:
                      hx=format(ord(ch),'X'); dec=str(ord(ch))
                      out.append('(?:'+re.escape(ch)+r'|&#x'+hx+r';|&#x'+hx.lower()+r';|&#'+dec+r';)')
              return ''.join(out)

          def replace_flex_all(old,new,label):
              global raw
              raw,n=re.subn(flex_pattern(old),enc(new),raw)
              if n<1:
                  raise SystemExit(f'{label}: expected >=1 match, found {n}')
              print(label,n)

          replace_once(
              'Vì vậy, cấu trúc đầu tư cần vừa đáp ứng nhu cầu riêng của từng nhóm chủ thể, vừa hình thành một hệ thống năng lực liên thông, tránh phát triển các hạng mục như những hệ thống độc lập.',
              'Vì vậy, cấu trúc đầu tư được tổ chức để vừa đáp ứng nhu cầu riêng của từng nhóm chủ thể, vừa hình thành một hệ thống năng lực liên thông, hạn chế phát triển các hạng mục thành những hệ thống độc lập.',
              'architecture lead')

          replace_flex_all(
              'không đồng nghĩa với tỷ lệ dự báo trực tiếp cho Thanh Hóa',
              'kịch bản của Thanh Hóa được xác định riêng trên cơ sở dữ liệu, mục tiêu và điều kiện vận hành của tỉnh',
              'benchmark disclaimer')

          replace_once(
              'Mỗi cảnh báo, phản ánh và luồng dữ liệu phải gắn với nghiệp vụ, ngưỡng và trách nhiệm xử lý cụ thể.',
              'Giá trị của cảnh báo, phản ánh và luồng dữ liệu hình thành khi chúng được gắn với nghiệp vụ, ngưỡng và trách nhiệm xử lý cụ thể.',
              'condition card voice')

          replace_once(
              'Hạ tầng tại điểm đến phải tạo được dữ liệu và dịch vụ thực tế; dữ liệu phải được chuẩn hóa để IOC, ứng dụng và hệ thống quản lý doanh nghiệp cùng sử dụng; nội dung số phải đi vào hành trình của du khách; phản ánh phải quay trở lại quy trình kiểm tra, chấn chỉnh và cải thiện chất lượng.',
              'Hiệu quả của toàn hệ thống hình thành khi hạ tầng tại điểm đến tạo được dữ liệu và dịch vụ thực tế; dữ liệu được chuẩn hóa để IOC, ứng dụng và hệ thống quản lý doanh nghiệp cùng sử dụng; nội dung số đi vào hành trình của du khách; phản ánh quay trở lại quy trình kiểm tra, chấn chỉnh và cải thiện chất lượng.',
              'operating condition paragraph')

          replace_once(
              'Thứ nhất, dữ liệu phải có đầu mối cập nhật, chuẩn dùng chung và khả năng tái sử dụng giữa các hệ thống; nếu không, IOC, ứng dụng và các công cụ AI sẽ chỉ phản ánh các nguồn thông tin rời rạc. Thứ hai, mỗi luồng dữ liệu và phản ánh phải gắn với một quy trình nghiệp vụ và trách nhiệm xử lý cụ thể; cảnh báo về quá tải, chất lượng dịch vụ hay phản ánh của du khách chỉ có giá trị khi dẫn tới hành động. Thứ ba, doanh nghiệp và các kênh thị trường phải được tích hợp thay vì bị thay thế: khu vực công tập trung vào dữ liệu chính thức, chuẩn dùng chung, hạ tầng và năng lực điều phối cấp tỉnh; doanh nghiệp tiếp tục thực hiện chức năng cạnh tranh, bán hàng, thanh toán, quản trị khách hàng và quảng bá.',
              'Thứ nhất, dữ liệu có đầu mối cập nhật, chuẩn dùng chung và khả năng tái sử dụng giữa các hệ thống để IOC, ứng dụng và các công cụ AI cùng khai thác một nguồn thông tin tin cậy. Thứ hai, mỗi luồng dữ liệu và phản ánh được gắn với quy trình nghiệp vụ và trách nhiệm xử lý cụ thể để cảnh báo về quá tải, chất lượng dịch vụ hay phản ánh của du khách dẫn tới hành động. Thứ ba, doanh nghiệp và các kênh thị trường được tích hợp vào hệ sinh thái thay vì bị thay thế: khu vực công tập trung vào dữ liệu chính thức, chuẩn dùng chung, hạ tầng và năng lực điều phối cấp tỉnh; doanh nghiệp tiếp tục thực hiện chức năng cạnh tranh, bán hàng, thanh toán, quản trị khách hàng và quảng bá.',
              'three operating conditions')

          dec=html.unescape(raw)
          forbidden=[
              'cấu trúc đầu tư cần vừa',
              'không đồng nghĩa với tỷ lệ dự báo trực tiếp cho Thanh Hóa',
              'Mỗi cảnh báo, phản ánh và luồng dữ liệu phải gắn',
              'Hạ tầng tại điểm đến phải tạo được dữ liệu',
              'Thứ nhất, dữ liệu phải có đầu mối',
              'Thứ hai, mỗi luồng dữ liệu và phản ánh phải gắn',
              'Thứ ba, doanh nghiệp và các kênh thị trường phải được tích hợp',
              'Thanh Hóa phải','tỉnh phải','tỉnh cần',
              'phải được xác định lại','thuộc bước thẩm định','chưa được thẩm định độc lập',
              'không được cộng trực tiếp','không được suy rộng'
          ]
          bad=[x for x in forbidden if x in dec]
          if bad:
              raise SystemExit('proposal voice QA residuals: '+repr(bad))

          required=[
              'cấu trúc đầu tư được tổ chức để vừa đáp ứng nhu cầu riêng của từng nhóm chủ thể',
              'kịch bản của Thanh Hóa được xác định riêng trên cơ sở dữ liệu, mục tiêu và điều kiện vận hành của tỉnh',
              '100% dữ liệu tài nguyên du lịch',
              '1.200–1.500 doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số',
              'Bảy hạng mục có quan hệ bổ trợ hai chiều, không phụ thuộc vào một trình tự vận hành cứng.'
          ]
          for x in required:
              if x not in dec:
                  raise SystemExit('missing required proposal content: '+x)

          p.write_text(raw,encoding='utf-8')
          print('PROPOSAL_AUTHOR_LANGUAGE_PASS')
          PY

      - name: Commit polish and remove workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Proposal QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/proposal-voice-polish.yml
          git add index.html .github/workflows/proposal-voice-polish.yml
          git commit -m "Polish TH-why proposal-author language"
          git push